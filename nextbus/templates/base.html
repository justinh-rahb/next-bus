<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Next Bus{% endblock %}{% if agency_name %} · {{ agency_name }}{% endif %}</title>
  <meta name="description" content="Live bus departures{% if agency_name %} for {{ agency_name }}{% endif %}.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/next-bus.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
  <script>
    // Set the theme before first paint to avoid a flash.
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      try { t = t || localStorage.getItem("nb:theme"); } catch (e) {}
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body class="{% if kiosk %}kiosk{% endif %} {% block body_class %}{% endblock %}">
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="var(--star-fill, none)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3m0 15v3M1.5 12h3m15 0h3M4.6 4.6l2.1 2.1m10.6 10.6 2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4m0 3v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-github" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
  </svg>

  <header class="topbar">
    {% block topbar_left %}
    <a class="brand" href="/" aria-label="Next Bus home">
      <img class="brand-logo" src="{{ settings.agency_logo_url or '/static/icons/next-bus.svg' }}" alt="" width="36" height="36">
      <span class="brand-name">Next Bus{% if agency_name %} <span class="brand-agency">{{ agency_name }}</span>{% endif %}</span>
    </a>
    {% endblock %}
    <div class="topbar-actions">
      {% block topbar_actions %}{% endblock %}
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Switch colour theme">
        <svg class="theme-light" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="theme-dark" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Data from {{ agency_name or "the transit agency" }}'s open GTFS feeds. Times may change without notice.</span>
    <a href="https://github.com/justinh-rahb/next-bus" class="footer-link" rel="noopener">
      <svg aria-hidden="true" width="16" height="16"><use href="#i-github"/></svg> Source
    </a>
  </footer>
</body>
</html>
